{% extends "base.html" %}
{% block title %}Links{% endblock %}
{% block content %}
<h1>Links</h1>
<p class="muted">The internal repos and Jira boards this workflow is linked to.</p>

<section id="links">
  {% include "_links.html" %}
</section>

<section x-data="{ open: false }" x-cloak>
  <button type="button" class="primary" @click="open = !open" x-text="open ? 'Close' : 'Add a link'"></button>
  <div x-show="open">
    <form hx-post="/links/repo" hx-target="#links" hx-swap="innerHTML">
      <h2>Add repo</h2>
      <input name="name" placeholder="name, e.g. api" required>
      <input name="repo_path" placeholder="path to the local git repository" required>
      <button class="primary">Add repo</button>
    </form>
    <form hx-post="/links/board" hx-target="#links" hx-swap="innerHTML">
      <h2>Add board</h2>
      <select name="provider">
        <option value="jira">Jira board</option>
      </select>
      <input name="ref" placeholder="Jira board id" required>
      <input name="label" placeholder="label (optional)">
      <button class="primary">Add board</button>
    </form>
  </div>
</section>

<section>
  <h2>Check</h2>
  <form hx-post="/links/check" hx-target="#check-results" hx-swap="innerHTML">
    <button>Check all links</button>
  </form>
  <div id="check-results"></div>
</section>
{% endblock %}
