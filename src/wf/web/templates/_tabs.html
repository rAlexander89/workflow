<div class="subtabs-row">
  <nav class="subtabs" hx-boost="true">
    <a href="/agents" class="{% if tab == 'pipeline' %}on{% endif %}">Pipeline</a>
    <a href="/board/backlog" class="{% if tab == 'backlog' %}on{% endif %}">Backlog</a>
  </nav>
  <form method="post" action="/agents/jira/sync">
    <input type="hidden" name="next" value="{{ '/board/backlog' if tab == 'backlog' else '/agents' }}">
    <button {% if state is defined and state.running %}disabled{% endif %}>Sync from Jira</button>
  </form>
</div>
<style>
  .subtabs-row { display:flex; justify-content:space-between; align-items:center; gap:12px; border-bottom:1px solid #2a2e38; margin:0 0 18px; }
  .subtabs { display:flex; gap:4px; }
  .subtabs a { padding:8px 14px; color:#9aa3b2; text-decoration:none; border-bottom:2px solid transparent; }
  .subtabs a.on { color:#f2f4f8; border-bottom-color:#eec13f; }
</style>
