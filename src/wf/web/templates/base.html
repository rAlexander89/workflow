<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wf · {% block title %}{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
  <script src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
  <style>
    :root { --bg:#fff; --fg:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7; --accent:#0b57d0; --bad:#b3261e; --ok:#18794e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111; --fg:#f2f2f2; --muted:#9a9aa0; --line:#333; --accent:#8ab4f8; --bad:#f2b8b5; --ok:#7fd1a7; }
    }
    body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
    nav { display:flex; gap:16px; padding:12px 16px; border-bottom:1px solid var(--line); }
    nav a { color:var(--muted); text-decoration:none; }
    nav a.on { color:var(--fg); font-weight:600; }
    main { padding:16px; max-width:900px; margin:0 auto; }
    h1 { font-size:1.4rem; margin:8px 0; }
    h2 { font-size:1.05rem; margin:20px 0 8px; }
    .muted { color:var(--muted); }
    .error { color:var(--bad); }
    .ok { color:var(--ok); }
    ul { list-style:none; padding:0; margin:0; }
    li { padding:10px 0; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    form { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; }
    input, select, textarea, button { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
    textarea { width:100%; min-height:80px; box-sizing:border-box; }
    button { cursor:pointer; }
    button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    button.danger { color:var(--bad); }
    button.on { border-color:var(--accent); color:var(--accent); }
    .filters { display:flex; gap:8px; margin:12px 0; }
    [x-cloak] { display:none !important; }
    @media (max-width:520px) { main { padding:16px; } input, select { flex:1 1 100%; } }
  </style>
</head>
<body>
  <nav>
    <a href="/board" class="{% if active == 'board' %}on{% endif %}">Sprint</a>
    <a href="/board/backlog" class="{% if active == 'backlog' %}on{% endif %}">Backlog</a>
    <a href="/board/outbox" class="{% if active == 'outbox' %}on{% endif %}">Outbox</a>
    <a href="/runs" class="{% if active == 'runs' %}on{% endif %}">Runs</a>
    <a href="/links" class="{% if active == 'links' %}on{% endif %}">Links</a>
  </nav>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
